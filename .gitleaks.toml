title = "gitleaks de encuesta-caba-pwa"

# Usa todas las reglas por defecto de gitleaks.
[extend]
useDefault = true

# Única excepción: la clave VAPID pública de legacy/app.js, que es pública por diseño.
# No se excluye ningún archivo entero, así que un secreto real en esos archivos se sigue detectando.
[[allowlists]]
description = "Clave pública VAPID del sitio anterior"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*vapidKey\s*:''']
